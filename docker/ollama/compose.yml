services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ../../data/ollama:/root/.ollama

    networks:
      - ai-network

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu


networks:

  ai-network:
    external: true
