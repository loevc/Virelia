services:

  open-webui:

    image: ghcr.io/open-webui/open-webui:main

    container_name: open-webui

    restart: unless-stopped


    ports:
      - "3000:8080"


    environment:

      # Ollama服务地址
      OLLAMA_BASE_URL: http://ollama:11434


      # 默认语言
      WEBUI_NAME: Virelia AI


    volumes:

      - ../../data/open-webui:/app/backend/data


    networks:

      - ai-network



networks:

  ai-network:

    external: true
